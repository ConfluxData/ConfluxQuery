name: Publish packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag already published on GitHub
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify stable published release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - id: version
        shell: bash
        run: |
          [[ "${{ inputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${{ inputs.tag }}"
          version="${version#v}"
          [[ "$(sed -n 's/^version = \"\\([^\"]*\\)\"/\\1/p' Cargo.toml | head -1)" == "$version" ]]
          gh release view "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY"
          echo "value=$version" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

  crates-io:
    name: Publish crates.io
    if: vars.ENABLE_CRATES_IO_PUBLISH == 'true'
    needs: verify
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish workspace crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crates.sh

  maven-central:
    name: Publish Maven Central
    if: vars.ENABLE_MAVEN_CENTRAL_PUBLISH == 'true'
    needs: verify
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: jdbc/pom.xml
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Publish signed Java artifacts
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -f jdbc/pom.xml -Prelease deploy

  homebrew:
    name: Update Homebrew tap
    if: vars.HOMEBREW_TAP != ''
    needs: verify
    runs-on: ubuntu-latest
    environment: homebrew
    steps:
      - uses: actions/checkout@v6
      - name: Generate formula from release checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: bash scripts/generate-homebrew-formula.sh "$TAG" "$GITHUB_REPOSITORY" > qcli.rb
      - name: Publish formula to tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: ${{ vars.HOMEBREW_TAP }}
        shell: bash
        run: |
          gh repo clone "$TAP" tap
          mkdir -p tap/Formula
          cp qcli.rb tap/Formula/qcli.rb
          cd tap
          git config user.name "qcli-release"
          git config user.email "qcli-release@users.noreply.github.com"
          git add Formula/qcli.rb
          git commit -m "qcli ${{ inputs.tag }}"
          git push
