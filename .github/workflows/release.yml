name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to rebuild
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release identity
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: identity
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || {
            echo "invalid release tag: $tag" >&2
            exit 1
          }
          version="${tag#v}"
          cargo_version="$(sed -n 's/^version = \"\\([^\"]*\\)\"/\\1/p' Cargo.toml | head -1)"
          base_version="${version%%-rc.*}"
          [[ "$cargo_version" == "$base_version" ]] || {
            echo "tag $tag does not match workspace version $cargo_version" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-rc.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-15
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --locked --release -p qcli
          strip: true
      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: bash scripts/package-release.sh "${{ matrix.target }}" "${{ needs.validate.outputs.version }}"
      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: scripts/package-release.ps1 "${{ matrix.target }}" "${{ needs.validate.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: qcli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  connectivity-conformance:
    name: Packaged ADBC and JDBC conformance
    needs: [validate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: qcli-x86_64-unknown-linux-gnu
          path: dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: conformance/m19/python/requirements.txt
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache-dependency-path: conformance/m19/go/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: conformance/m19/java/pom.xml
      - name: Start gateway from release archive
        shell: bash
        run: |
          tar -xzf dist/qcli-${{ needs.validate.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz -C /tmp
          cp examples/milestone-11-auth.toml /tmp/qcli-m19-auth.toml
          chmod 600 /tmp/qcli-m19-auth.toml
          /tmp/qcli-${{ needs.validate.outputs.version }}-x86_64-unknown-linux-gnu/qcli \
            --config examples/milestone-2.env serve \
            --bind 127.0.0.1:18089 \
            --auth-file /tmp/qcli-m19-auth.toml \
            --flight-bind 127.0.0.1:32010 \
            >/tmp/qcli-m19-server.log 2>&1 &
          echo "$!" > /tmp/qcli-m19-server.pid
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:18089/openapi.json >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qcli-m19-server.log
          exit 1
      - run: pip install -r conformance/m19/python/requirements.txt
      - name: Python ADBC 1.12
        run: python conformance/m19/python/profile.py
        env:
          QCLI_FLIGHT_TOKEN: qcli_k1_demo-key_694251ef9e5a41a3a3318ae40d7549ea04f86624d9e64b02a3f474bfa0282916
          QCLI_FLIGHT_TARGET: demo
      - name: Go ADBC 1.12
        working-directory: conformance/m19/go
        run: go run .
        env:
          QCLI_FLIGHT_TOKEN: qcli_k1_demo-key_694251ef9e5a41a3a3318ae40d7549ea04f86624d9e64b02a3f474bfa0282916
          QCLI_FLIGHT_TARGET: demo
      - name: Java ADBC 0.24
        run: mvn -q -f conformance/m19/java/pom.xml compile exec:java -Dexec.mainClass=org.apache.qcli.AdbcProfile
        env:
          QCLI_FLIGHT_TOKEN: qcli_k1_demo-key_694251ef9e5a41a3a3318ae40d7549ea04f86624d9e64b02a3f474bfa0282916
          QCLI_FLIGHT_TARGET: demo
          MAVEN_OPTS: --add-opens=java.base/java.nio=ALL-UNNAMED
      - name: Arrow Flight SQL JDBC 19
        run: mvn -q -f conformance/m19/java/pom.xml exec:java -Dexec.mainClass=org.apache.qcli.JdbcProfile
        env:
          QCLI_FLIGHT_TOKEN: qcli_k1_demo-key_694251ef9e5a41a3a3318ae40d7549ea04f86624d9e64b02a3f474bfa0282916
          QCLI_FLIGHT_TARGET: demo
          MAVEN_OPTS: --add-opens=java.base/java.nio=ALL-UNNAMED
      - name: Rust ADBC C driver manager 0.24
        run: cargo run --locked --manifest-path conformance/m19/rust/Cargo.toml
        env:
          QCLI_FLIGHT_TOKEN: qcli_k1_demo-key_694251ef9e5a41a3a3318ae40d7549ea04f86624d9e64b02a3f474bfa0282916
          QCLI_FLIGHT_TARGET: demo
      - name: Stop gateway
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/qcli-m19-server.pid ]]; then kill "$(cat /tmp/qcli-m19-server.pid)" || true; fi
          cat /tmp/qcli-m19-server.log || true

  publish-github:
    name: Sign and publish GitHub release
    needs: [validate, build, connectivity-conformance]
    runs-on: ubuntu-latest
    environment: github-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum qcli-* > SHA256SUMS
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/qcli-${{ needs.validate.outputs.version }}.spdx.json
      - name: Attest release archives
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/qcli-*.tar.gz
            dist/qcli-*.zip
      - uses: sigstore/cosign-installer@v3
      - name: Sign release files with GitHub OIDC
        working-directory: dist
        shell: bash
        run: |
          while IFS= read -r file; do
            cosign sign-blob --yes "$file" --bundle "${file}.sigstore.json"
          done < <(find . -maxdepth 1 -type f ! -name '*.sigstore.json' -printf '%f\n' | sort)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        shell: bash
        run: |
          options=(--verify-tag --generate-notes --title "qcli ${TAG}")
          if [[ "$PRERELEASE" == "true" ]]; then options+=(--prerelease); fi
          gh release create "$TAG" dist/* "${options[@]}"

  dispatch-stable-publication:
    name: Dispatch stable package publication
    if: needs.validate.outputs.prerelease == 'false'
    needs: [validate, publish-github]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start guarded crates.io and Homebrew workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: gh workflow run publish-packages.yml --repo "$GITHUB_REPOSITORY" -f tag="$TAG"
