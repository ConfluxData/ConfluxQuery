name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to rebuild
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name || inputs.tag }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release identity
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
      revision: ${{ steps.identity.outputs.revision }}
      released_at: ${{ steps.identity.outputs.released_at }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - id: identity
        shell: bash
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || {
            echo "invalid release tag: $tag" >&2
            exit 1
          }
          version="${tag#v}"
          cargo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          base_version="${version%%-rc.*}"
          [[ "$cargo_version" == "$base_version" ]] || {
            echo "tag $tag does not match workspace version $cargo_version" >&2
            exit 1
          }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "released_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-rc.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate release metadata
        shell: bash
        env:
          TAG: ${{ steps.identity.outputs.tag }}
          VERSION: ${{ steps.identity.outputs.version }}
          REVISION: ${{ steps.identity.outputs.revision }}
          RELEASED_AT: ${{ steps.identity.outputs.released_at }}
          PRERELEASE: ${{ steps.identity.outputs.prerelease }}
        run: |
          mkdir -p release-metadata
          jq --null-input \
            --arg product "ConfluxQuery" \
            --arg executable "qcli" \
            --arg version "$VERSION" \
            --arg tag "$TAG" \
            --arg revision "$REVISION" \
            --arg released_at "$RELEASED_AT" \
            --arg released_by "$GITHUB_ACTOR" \
            --arg released_by_url "${GITHUB_SERVER_URL}/${GITHUB_ACTOR}" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg workflow_run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --argjson workflow_attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson prerelease "$PRERELEASE" \
            '{schema_version: 1, product: $product, executable: $executable, version: $version, tag: $tag, prerelease: $prerelease, git_commit: $revision, released_at: $released_at, released_by: {login: $released_by, profile: $released_by_url}, repository: $repository, workflow_run: $workflow_run, workflow_attempt: $workflow_attempt}' \
            > release-metadata/RELEASE-METADATA.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: release-metadata/RELEASE-METADATA.json
          if-no-files-found: error
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-15
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --locked --release -p qcli
          strip: true
      - uses: actions/download-artifact@v4
        with:
          name: release-metadata
          path: release-metadata
      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: bash scripts/package-release.sh "${{ matrix.target }}" "${{ needs.validate.outputs.version }}" release-metadata/RELEASE-METADATA.json
      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: scripts/package-release.ps1 "${{ matrix.target }}" "${{ needs.validate.outputs.version }}" release-metadata/RELEASE-METADATA.json
      - uses: actions/upload-artifact@v4
        with:
          name: qcli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  jdbc:
    name: Build ConfluxQuery JDBC artifacts
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: jdbc/pom.xml
      - name: Build driver at release version
        run: |
          mvn -B -f jdbc/pom.xml versions:set -DnewVersion=${{ needs.validate.outputs.version }} -DgenerateBackupPoms=false
          mvn -B -f jdbc/pom.xml clean verify
      - name: Stage Maven and standalone artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp jdbc/pom.xml dist/confluxquery-jdbc-${{ needs.validate.outputs.version }}.pom
          cp jdbc/target/confluxquery-jdbc-${{ needs.validate.outputs.version }}.jar dist/
          cp jdbc/target/confluxquery-jdbc-${{ needs.validate.outputs.version }}-all.jar dist/
          cp jdbc/target/confluxquery-jdbc-${{ needs.validate.outputs.version }}-sources.jar dist/
          cp jdbc/target/confluxquery-jdbc-${{ needs.validate.outputs.version }}-javadoc.jar dist/
          cp jdbc/target/confluxquery-jdbc-${{ needs.validate.outputs.version }}.cdx.json dist/
      - uses: actions/upload-artifact@v4
        with:
          name: confluxquery-jdbc
          path: dist/*
          if-no-files-found: error

  connectivity-conformance:
    name: Packaged ADBC and JDBC conformance
    needs: [validate, build, jdbc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: qcli-x86_64-unknown-linux-gnu
          path: dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: conformance/m19/python/requirements.txt
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache-dependency-path: conformance/m19/go/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            jdbc/pom.xml
            conformance/m19/java/pom.xml
            conformance/m25/java/pom.xml
      - name: Install branded JDBC driver
        run: |
          mvn -B -f jdbc/pom.xml versions:set -DnewVersion=${{ needs.validate.outputs.version }} -DgenerateBackupPoms=false
          mvn -B -f jdbc/pom.xml install
      - name: Start gateway from release archive
        shell: bash
        run: |
          tar -xzf dist/qcli-${{ needs.validate.outputs.version }}-x86_64-unknown-linux-gnu.tar.gz -C /tmp
          cp examples/milestone-11-auth.toml /tmp/qcli-m19-auth.toml
          chmod 600 /tmp/qcli-m19-auth.toml
          /tmp/qcli-${{ needs.validate.outputs.version }}-x86_64-unknown-linux-gnu/qcli \
            --config examples/milestone-2.env serve \
            --bind 127.0.0.1:18089 \
            --auth-file /tmp/qcli-m19-auth.toml \
            --flight-bind 127.0.0.1:32010 \
            >/tmp/qcli-m19-server.log 2>&1 &
          echo "$!" > /tmp/qcli-m19-server.pid
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:18089/openapi.json >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qcli-m19-server.log
          exit 1
      - run: pip install -r conformance/m19/python/requirements.txt
      - name: HTTP API profile
        run: python conformance/m24/http_profile.py
        env:
          QCLI_HTTP_TOKEN: qcli_k1_demo-key_694251ef9e5a41a3a3318ae40d7549ea04f86624d9e64b02a3f474bfa0282916
      - name: Python ADBC 1.12
        run: python conformance/m19/python/profile.py
        env:
          QCLI_FLIGHT_TOKEN: qcli_k1_demo-key_694251ef9e5a41a3a3318ae40d7549ea04f86624d9e64b02a3f474bfa0282916
          QCLI_FLIGHT_TARGET: demo
      - name: Go ADBC 1.12
        working-directory: conformance/m19/go
        run: go run .
        env:
          QCLI_FLIGHT_TOKEN: qcli_k1_demo-key_694251ef9e5a41a3a3318ae40d7549ea04f86624d9e64b02a3f474bfa0282916
          QCLI_FLIGHT_TARGET: demo
      - name: Java ADBC 0.24
        run: mvn -q -f conformance/m19/java/pom.xml compile exec:java -Dexec.mainClass=org.apache.qcli.AdbcProfile
        env:
          QCLI_FLIGHT_TOKEN: qcli_k1_demo-key_694251ef9e5a41a3a3318ae40d7549ea04f86624d9e64b02a3f474bfa0282916
          QCLI_FLIGHT_TARGET: demo
          MAVEN_OPTS: --add-opens=java.base/java.nio=ALL-UNNAMED
      - name: Arrow Flight SQL JDBC 19
        run: mvn -q -f conformance/m19/java/pom.xml exec:java -Dexec.mainClass=org.apache.qcli.JdbcProfile
        env:
          QCLI_FLIGHT_TOKEN: qcli_k1_demo-key_694251ef9e5a41a3a3318ae40d7549ea04f86624d9e64b02a3f474bfa0282916
          QCLI_FLIGHT_TARGET: demo
          MAVEN_OPTS: --add-opens=java.base/java.nio=ALL-UNNAMED
      - name: ConfluxQuery JDBC
        run: mvn -B -q -f conformance/m25/java/pom.xml -Dconfluxquery.jdbc.version=${{ needs.validate.outputs.version }} compile exec:java -Dexec.mainClass=in.confluxdata.query.jdbc.ConformanceProfile
        env:
          QCLI_FLIGHT_TOKEN: qcli_k1_demo-key_694251ef9e5a41a3a3318ae40d7549ea04f86624d9e64b02a3f474bfa0282916
          QCLI_FLIGHT_TARGET: demo
          MAVEN_OPTS: --add-opens=java.base/java.nio=ALL-UNNAMED
      - name: Rust ADBC C driver manager 0.24
        run: cargo run --locked --manifest-path conformance/m19/rust/Cargo.toml
        env:
          QCLI_FLIGHT_TOKEN: qcli_k1_demo-key_694251ef9e5a41a3a3318ae40d7549ea04f86624d9e64b02a3f474bfa0282916
          QCLI_FLIGHT_TARGET: demo
      - name: Experimental ODBC profile integrity
        run: python -c 'from pathlib import Path; compile(Path("conformance/m20/python/profile.py").read_text(), "profile.py", "exec")'
      - name: Stop gateway
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/qcli-m19-server.pid ]]; then kill "$(cat /tmp/qcli-m19-server.pid)" || true; fi
          cat /tmp/qcli-m19-server.log || true

  release-gates:
    name: Load, security, and HA release gates
    needs: validate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: qcli_test
          POSTGRES_DB: qcli_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d qcli_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p qcli-cluster postgres_coordination_profile --locked -- --ignored
        env:
          QCLI_TEST_POSTGRES_URL: postgresql://postgres:qcli_test@127.0.0.1:5432/qcli_test
      - run: cargo test --release -p qcli-core million_rows_stream_in_bounded_batches_to_csv_and_jsonl --locked -- --ignored
      - run: cargo test -p qcli-http -p qcli-flight-sql -p qcli-service --locked

  container:
    name: Build OCI server image
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - name: Build and smoke image
        run: |
          docker build \
            --build-arg QCLI_VERSION=${{ needs.validate.outputs.version }} \
            --build-arg QCLI_REVISION=${{ needs.validate.outputs.revision }} \
            --build-arg QCLI_RELEASED_AT=${{ needs.validate.outputs.released_at }} \
            --build-arg QCLI_RELEASED_BY=${{ github.actor }} \
            --build-arg QCLI_RELEASE_TAG=${{ needs.validate.outputs.tag }} \
            --build-arg QCLI_PRERELEASE=${{ needs.validate.outputs.prerelease }} \
            --build-arg QCLI_REPOSITORY=${{ github.repository }} \
            --build-arg QCLI_WORKFLOW_RUN=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} \
            --build-arg QCLI_WORKFLOW_ATTEMPT=${{ github.run_attempt }} \
            --label org.opencontainers.image.revision=${{ needs.validate.outputs.revision }} \
            --label org.opencontainers.image.created=${{ needs.validate.outputs.released_at }} \
            --tag qcli:${{ needs.validate.outputs.version }} .
          docker run --rm qcli:${{ needs.validate.outputs.version }} --version
          docker run --rm --entrypoint cat qcli:${{ needs.validate.outputs.version }} \
            /usr/share/doc/qcli/RELEASE-METADATA.json
      - name: Export OCI image archive
        run: |
          mkdir -p dist
          docker save qcli:${{ needs.validate.outputs.version }} | gzip -9 > dist/qcli-${{ needs.validate.outputs.version }}-linux-amd64.oci.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: qcli-container
          path: dist/*
          if-no-files-found: error

  publish-github:
    name: Sign and publish GitHub release
    needs: [validate, build, jdbc, container, connectivity-conformance, release-gates]
    runs-on: ubuntu-latest
    environment: github-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate checksums
        working-directory: dist
        run: sha256sum qcli-* confluxquery-jdbc-* RELEASE-METADATA.json > SHA256SUMS
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/qcli-${{ needs.validate.outputs.version }}.spdx.json
      - name: Attest release archives
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/qcli-*.tar.gz
            dist/qcli-*.zip
            dist/confluxquery-jdbc-*.jar
            dist/RELEASE-METADATA.json
      - uses: sigstore/cosign-installer@v3
      - name: Sign release files with GitHub OIDC
        working-directory: dist
        shell: bash
        run: |
          while IFS= read -r file; do
            cosign sign-blob --yes "$file" --bundle "${file}.sigstore.json"
          done < <(find . -maxdepth 1 -type f ! -name '*.sigstore.json' -printf '%f\n' | sort)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        shell: bash
        run: |
          options=(--verify-tag --generate-notes --title "qcli ${TAG}")
          if [[ "$PRERELEASE" == "true" ]]; then options+=(--prerelease); fi
          gh release create "$TAG" dist/* "${options[@]}"

  publish-container:
    name: Publish server image to GHCR
    needs: [validate, container, publish-github]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qcli-container
          path: dist
      - name: Load tested release image
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: gunzip --stdout "dist/qcli-${VERSION}-linux-amd64.oci.tar.gz" | docker load
      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish release tags
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          REVISION: ${{ needs.validate.outputs.revision }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          source="qcli:${VERSION}"
          tags=("${VERSION}" "sha-${REVISION}")
          if [[ "$PRERELEASE" == "false" ]]; then tags+=(latest); fi

          for tag in "${tags[@]}"; do
            docker tag "$source" "${image}:${tag}"
            docker push "${image}:${tag}"
          done

  dispatch-stable-publication:
    name: Dispatch stable package publication
    if: needs.validate.outputs.prerelease == 'false'
    needs: [validate, publish-github, publish-container]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Start guarded crates.io and Homebrew workflow
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: gh workflow run publish-packages.yml --repo "$GITHUB_REPOSITORY" -f tag="$TAG"
