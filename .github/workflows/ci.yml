name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Format, lint, and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked -p qcli
      - name: Installed-binary smoke test
        shell: bash
        run: |
          binary="target/release/qcli"
          if [[ "${{ runner.os }}" == "Windows" ]]; then binary="${binary}.exe"; fi
          "$binary" --version
          "$binary" --config examples/milestone-2.env config check
          "$binary" --config examples/milestone-2.env target list

  msrv:
    name: Minimum Rust 1.86
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --workspace --all-targets --locked

  security:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  connectivity-conformance:
    name: ADBC and JDBC conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: m19-rust-adbc
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: conformance/m19/python/requirements.txt
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache-dependency-path: conformance/m19/go/go.sum
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: conformance/m19/java/pom.xml
      - run: cargo build --release --locked -p qcli
      - name: Start packaged-equivalent demo gateway
        shell: bash
        run: |
          cp examples/milestone-11-auth.toml /tmp/qcli-m19-auth.toml
          chmod 600 /tmp/qcli-m19-auth.toml
          target/release/qcli --config examples/milestone-2.env serve \
            --bind 127.0.0.1:18089 \
            --auth-file /tmp/qcli-m19-auth.toml \
            --flight-bind 127.0.0.1:32010 \
            >/tmp/qcli-m19-server.log 2>&1 &
          echo "$!" > /tmp/qcli-m19-server.pid
          for attempt in {1..60}; do
            if curl --silent --fail http://127.0.0.1:18089/openapi.json >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/qcli-m19-server.log
          exit 1
      - run: pip install -r conformance/m19/python/requirements.txt
      - name: Python ADBC 1.12
        run: python conformance/m19/python/profile.py
        env:
          QCLI_FLIGHT_TOKEN: qcli_k1_demo-key_694251ef9e5a41a3a3318ae40d7549ea04f86624d9e64b02a3f474bfa0282916
          QCLI_FLIGHT_TARGET: demo
      - name: Go ADBC 1.12
        working-directory: conformance/m19/go
        run: go run .
        env:
          QCLI_FLIGHT_TOKEN: qcli_k1_demo-key_694251ef9e5a41a3a3318ae40d7549ea04f86624d9e64b02a3f474bfa0282916
          QCLI_FLIGHT_TARGET: demo
      - name: Java ADBC 0.24
        run: mvn -q -f conformance/m19/java/pom.xml compile exec:java -Dexec.mainClass=org.apache.qcli.AdbcProfile
        env:
          QCLI_FLIGHT_TOKEN: qcli_k1_demo-key_694251ef9e5a41a3a3318ae40d7549ea04f86624d9e64b02a3f474bfa0282916
          QCLI_FLIGHT_TARGET: demo
          MAVEN_OPTS: --add-opens=java.base/java.nio=ALL-UNNAMED
      - name: Arrow Flight SQL JDBC 19
        run: mvn -q -f conformance/m19/java/pom.xml exec:java -Dexec.mainClass=org.apache.qcli.JdbcProfile
        env:
          QCLI_FLIGHT_TOKEN: qcli_k1_demo-key_694251ef9e5a41a3a3318ae40d7549ea04f86624d9e64b02a3f474bfa0282916
          QCLI_FLIGHT_TARGET: demo
          MAVEN_OPTS: --add-opens=java.base/java.nio=ALL-UNNAMED
      - name: Rust ADBC C driver manager 0.24
        run: cargo run --locked --manifest-path conformance/m19/rust/Cargo.toml
        env:
          QCLI_FLIGHT_TOKEN: qcli_k1_demo-key_694251ef9e5a41a3a3318ae40d7549ea04f86624d9e64b02a3f474bfa0282916
          QCLI_FLIGHT_TARGET: demo
      - name: M20 ODBC profile integrity
        run: python -c 'from pathlib import Path; compile(Path("conformance/m20/python/profile.py").read_text(), "profile.py", "exec")'
      - name: Stop gateway
        if: always()
        shell: bash
        run: |
          if [[ -f /tmp/qcli-m19-server.pid ]]; then kill "$(cat /tmp/qcli-m19-server.pid)" || true; fi
          cat /tmp/qcli-m19-server.log || true
