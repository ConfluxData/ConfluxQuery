[workspace]
members = [
    "crates/qcli-auth",
    "crates/qcli-cli",
    "crates/qcli-cluster",
    "crates/qcli-config",
    "crates/qcli-driver-conformance",
    "crates/qcli-core",
    "crates/qcli-driver-api",
    "crates/qcli-driver-databricks",
    "crates/qcli-driver-demo",
    "crates/qcli-driver-snowflake",
    "crates/qcli-driver-trino",
    "crates/qcli-flight-sql",
    "crates/qcli-http",
    "crates/qcli-metadata",
    "crates/qcli-output",
    "crates/qcli-repl",
    "crates/qcli-service",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.86"
version = "0.1.0"

[workspace.dependencies]
arrow-array = "59.1.0"
arrow-cast = "59.1.0"
arrow-csv = "59.1.0"
arrow-json = "59.1.0"
arrow-ipc = "59.1.0"
arrow-schema = "59.1.0"
arrow-flight = { version = "59.1.0", features = ["flight-sql", "tls-ring"] }
async-trait = "0.1.91"
bytes = "1.10.1"
axum = "0.8.4"
argon2 = "0.5.3"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3"
hmac = "0.12.1"
jsonwebtoken = { version = "10.2.0", default-features = false, features = ["rust_crypto"] }
object_store = { version = "0.13.1", features = ["aws"] }
prost = "0.14.4"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10.9"
toml = "0.9.8"
signal-hook = "0.3.18"
snowflakedb-rs = { version = "1.1.7", features = ["arrow", "chrono", "decimal", "reqwest"] }
rustyline = { version = "18.0.1", default-features = false, features = ["custom-bindings", "derive", "with-file-history"] }
tokio = { version = "1.53.0", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7.15", features = ["with-chrono-0_4", "with-serde_json-1"] }
tonic = { version = "0.14.2", features = ["transport", "tls-ring"] }
tonic-health = "0.14.2"
tower = "0.5.2"
trino-rust-client = "0.11.0"
url = "2.5"
utoipa = { version = "5.5.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "debug-embed", "vendored"] }
uuid = { version = "1.17.0", features = ["v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
