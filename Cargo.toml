[workspace]
members = [
    "crates/qcli-cli",
    "crates/qcli-config",
    "crates/qcli-core",
    "crates/qcli-driver-api",
    "crates/qcli-driver-demo",
    "crates/qcli-driver-trino",
    "crates/qcli-metadata",
    "crates/qcli-output",
    "crates/qcli-repl",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.86"
version = "0.1.0"

[workspace.dependencies]
arrow-array = "59.1.0"
arrow-cast = "59.1.0"
arrow-csv = "59.1.0"
arrow-json = "59.1.0"
arrow-schema = "59.1.0"
async-trait = "0.1.91"
chrono = "0.4.45"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
signal-hook = "0.3.18"
rustyline = { version = "18.0.1", default-features = false, features = ["custom-bindings", "derive", "with-file-history"] }
tokio = { version = "1.53.0", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
trino-rust-client = "0.11.0"
url = "2.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
