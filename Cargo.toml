[workspace]
members = [
    "crates/qcli-cli",
    "crates/qcli-config",
    "crates/qcli-core",
    "crates/qcli-driver-api",
    "crates/qcli-driver-demo",
    "crates/qcli-output",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
arrow-array = "59.1.0"
arrow-schema = "59.1.0"
async-trait = "0.1.91"
tokio = { version = "1.53.0", features = ["macros", "rt", "rt-multi-thread", "sync"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
